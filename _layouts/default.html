  <script>
    // Mobile nav toggle with focus trap and Escape handling
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.site-nav');
    const focusableSelectors = 'a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])';
    let navFocusables = [];

    function updateNavFocusables() {
      if (!nav) return;
      navFocusables = Array.from(nav.querySelectorAll(focusableSelectors));
    }

    function closeMobileNav() {
      if (!toggle || !nav) return;
      toggle.setAttribute('aria-expanded', 'false');
      nav.classList.remove('open');
      toggle.classList.remove('open');
      toggle.focus();
    }

    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        const expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        nav.classList.toggle('open');
        toggle.classList.toggle('open');
        updateNavFocusables();
        if (!expanded && navFocusables.length) {
          navFocusables[0].focus();
        }
      });

      toggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle.click();
        }
      });

      nav.addEventListener('keydown', (e) => {
        if (!nav.classList.contains('open')) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          closeMobileNav();
          return;
        }
        if (e.key !== 'Tab' || navFocusables.length < 2) return;
        const first = navFocusables[0];
        const last = navFocusables[navFocusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      });
    }

    // Intersection Observer for scroll animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.animate-in').forEach(el => observer.observe(el));

    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', e => {
        const target = document.querySelector(a.getAttribute('href'));
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          target.setAttribute('tabindex', '-1');
          target.focus({ preventScroll: true });
        }
      });
    });

    // Add anchor links to headings inside the main content
    document.querySelectorAll('.container h2, .container h3').forEach(heading => {
      if (!heading.id) {
        const id = heading.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        if (id) heading.id = id;
      }
      if (heading.id && !heading.querySelector('.anchor-link')) {
        const a = document.createElement('a');
        a.className = 'anchor-link';
        a.href = '#' + heading.id;
        a.setAttribute('aria-label', 'Permalink to ' + heading.textContent.trim());
        a.textContent = '#';
        heading.appendChild(a);
      }
    });

    // Toggle long video playlist lists on /stack/
    document.querySelectorAll('.toggle-videos').forEach(button => {
      const wrapper = button.closest('.playlist-section');
      if (!wrapper) return;
      button.addEventListener('click', () => {
        const collapsed = wrapper.classList.toggle('is-collapsed');
        button.textContent = collapsed ? button.dataset.collapsedText || 'Show all videos' : button.dataset.expandedText || 'Show fewer videos';
      });
    });
  </script>
